<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">PCAM taxon-by-sample transformation</title>
  <desc id="desc">A phylogenetic tree and two taxon-by-sample matrices are transformed by PCAM into four stacked synthetic-community profiles.</desc>
  <rect x="14" y="14" width="1172" height="472" rx="58" fill="#EDF6F3"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#233238">
    <text x="390" y="70" text-anchor="middle" font-size="34" font-weight="600">Taxon × Sample</text>
    <text x="600" y="464" text-anchor="middle" font-size="40" font-weight="500" letter-spacing="1">PCAM</text>
  </g>

  <!-- Phylogenetic tree: neutral structure with muted taxon markers -->
  <g fill="none" stroke="#34444A" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M48 260 H80 M80 162 V340 M80 208 H120 M80 340 H120"/>
    <path d="M120 118 V208 M120 140 H176 M176 118 V163 M176 118 H259 M176 163 H259 M120 208 H259"/>
    <path d="M120 318 V408 M120 340 H176 M176 318 V363 M176 318 H259 M176 363 H259 M120 408 H259"/>
  </g>
  <g fill="#7E8B8F">
    <circle cx="80" cy="260" r="7"/>
    <circle cx="120" cy="208" r="7"/>
    <circle cx="176" cy="140" r="7"/>
    <circle cx="120" cy="340" r="7"/>
    <circle cx="176" cy="340" r="7"/>
  </g>
  <g stroke="#56666B" stroke-width="2.5">
    <circle cx="270" cy="118" r="12" fill="#86B79F"/>
    <circle cx="270" cy="163" r="12" fill="#86A6C9"/>
    <circle cx="270" cy="208" r="12" fill="#B39AB8"/>
    <circle cx="270" cy="318" r="12" fill="#CF8F8A"/>
    <circle cx="270" cy="363" r="12" fill="#D8AA78"/>
    <circle cx="270" cy="408" r="12" fill="#D8C786"/>
  </g>

  <!-- Taxon × sample matrices -->
  <g stroke="#2F4045" stroke-width="2">
    <rect x="300" y="95" width="45" height="45" fill="#E9F2ED"/><rect x="345" y="95" width="45" height="45" fill="#BDD8CB"/><rect x="390" y="95" width="45" height="45" fill="#86B79F"/><rect x="435" y="95" width="45" height="45" fill="#4F8D73"/>
    <rect x="300" y="140" width="45" height="45" fill="#EAF0F6"/><rect x="345" y="140" width="45" height="45" fill="#BED0E1"/><rect x="390" y="140" width="45" height="45" fill="#86A6C9"/><rect x="435" y="140" width="45" height="45" fill="#4B77AB"/>
    <rect x="300" y="185" width="45" height="45" fill="#F0ECF2"/><rect x="345" y="185" width="45" height="45" fill="#D6C8D9"/><rect x="390" y="185" width="45" height="45" fill="#B39AB8"/><rect x="435" y="185" width="45" height="45" fill="#8B6C91"/>

    <rect x="300" y="295" width="45" height="45" fill="#F7ECEA"/><rect x="345" y="295" width="45" height="45" fill="#E7C4C0"/><rect x="390" y="295" width="45" height="45" fill="#CF8F8A"/><rect x="435" y="295" width="45" height="45" fill="#B85C58"/>
    <rect x="300" y="340" width="45" height="45" fill="#F8F0E8"/><rect x="345" y="340" width="45" height="45" fill="#EBCFAD"/><rect x="390" y="340" width="45" height="45" fill="#D8AA78"/><rect x="435" y="340" width="45" height="45" fill="#C07C48"/>
    <rect x="300" y="385" width="45" height="45" fill="#FAF6E9"/><rect x="345" y="385" width="45" height="45" fill="#EDE3B9"/><rect x="390" y="385" width="45" height="45" fill="#D8C786"/><rect x="435" y="385" width="45" height="45" fill="#BEA64F"/>
  </g>

  <!-- Transformation arrow -->
  <g fill="#233238">
    <rect x="535" y="244" width="91" height="7" rx="3.5"/>
    <path d="M626 225 L662 247.5 L626 270 Z"/>
  </g>

  <!-- Synthetic-community labels -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#233238" font-size="22" font-weight="600" text-anchor="middle">
    <text x="725" y="105">s2+s3</text>
    <text x="825" y="105">s1+s4</text>
    <text x="925" y="105">s1+s2</text>
    <text x="1025" y="105">s1+s4</text>
  </g>

  <!-- Stacked synthetic-community profiles -->
  <g stroke="#2F4045" stroke-width="2">
    <rect x="701" y="120" width="48" height="45" fill="#86B79F"/><rect x="701" y="165" width="48" height="45" fill="#86A6C9"/><rect x="701" y="210" width="48" height="45" fill="#B39AB8"/><rect x="701" y="255" width="48" height="45" fill="#CF8F8A"/><rect x="701" y="300" width="48" height="45" fill="#D8AA78"/><rect x="701" y="345" width="48" height="45" fill="#D8C786"/>
    <rect x="801" y="120" width="48" height="45" fill="#4F8D73"/><rect x="801" y="165" width="48" height="45" fill="#4B77AB"/><rect x="801" y="210" width="48" height="45" fill="#8B6C91"/><rect x="801" y="255" width="48" height="45" fill="#F7ECEA"/><rect x="801" y="300" width="48" height="45" fill="#F8F0E8"/><rect x="801" y="345" width="48" height="45" fill="#FAF6E9"/>
    <rect x="901" y="120" width="48" height="45" fill="#E9F2ED"/><rect x="901" y="165" width="48" height="45" fill="#EAF0F6"/><rect x="901" y="210" width="48" height="45" fill="#F0ECF2"/><rect x="901" y="255" width="48" height="45" fill="#CF8F8A"/><rect x="901" y="300" width="48" height="45" fill="#EBCFAD"/><rect x="901" y="345" width="48" height="45" fill="#D8C786"/>
    <rect x="1001" y="120" width="48" height="45" fill="#E9F2ED"/><rect x="1001" y="165" width="48" height="45" fill="#EAF0F6"/><rect x="1001" y="210" width="48" height="45" fill="#F0ECF2"/><rect x="1001" y="255" width="48" height="45" fill="#B85C58"/><rect x="1001" y="300" width="48" height="45" fill="#C07C48"/><rect x="1001" y="345" width="48" height="45" fill="#BEA64F"/>
  </g>

  <g fill="#233238">
    <circle cx="1100" cy="254" r="5"/><circle cx="1120" cy="254" r="5"/><circle cx="1140" cy="254" r="5"/>
  </g>
</svg>
